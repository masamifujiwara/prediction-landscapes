<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="985" viewBox="0 0 1000 985" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="1000" height="985" fill="#ffffff"/>

  <!-- Data -->
  <rect x="200" y="15" width="460" height="80" rx="6" fill="#eeeeee" stroke="#444"/>
  <text x="430" y="38" text-anchor="middle" font-size="15" font-weight="bold">Data: TPWD bag seine and bay trawl, 1982 to 2024</text>
  <text x="430" y="60" text-anchor="middle" font-size="13">Monthly series, 7 estuaries and coastwide</text>
  <text x="430" y="80" text-anchor="middle" font-size="13">Biodiversity q = 0, 1, 2 (48 series); abundance of 8 taxa (128 series)</text>

  <!-- Forecast-date loop frame -->
  <rect x="25" y="125" width="750" height="440" rx="8" fill="none" stroke="#666" stroke-dasharray="7,5"/>
  <text x="40" y="146" font-size="13" font-style="italic" fill="#333">Repeated at each of 390 forecast dates (April 1992 to November 2024); only data up to that date are used</text>

  <path d="M430,95 L430,110 L715,110 L715,160" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Step 1 seasonal -->
  <rect x="55" y="162" width="690" height="68" rx="6" fill="#f6f6f6" stroke="#444"/>
  <text x="400" y="186" text-anchor="middle" font-size="14" font-weight="bold">1. Seasonal curve fitted to the months up to the forecast date</text>
  <text x="400" y="207" text-anchor="middle" font-size="13">Harmonic regression (12-, 6- and 4-month waves); departure = value minus curve</text>
  <text x="400" y="223" text-anchor="middle" font-size="12" fill="#444">Trends, swings and steps stay in the departures</text>

  <line x1="225" y1="230" x2="225" y2="268" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="590" y1="230" x2="590" y2="268" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Step 2a models -->
  <rect x="45" y="270" width="380" height="280" rx="6" fill="#e8f0fa" stroke="#2b5d9b"/>
  <text x="235" y="293" text-anchor="middle" font-size="14" font-weight="bold">2a. Forecast models (Table 1)</text>
  <text x="235" y="311" text-anchor="middle" font-size="12">Forecasts of the departures, 1 to 24 months ahead</text>
  <text x="60" y="340" font-size="13" font-weight="bold">Main models</text>
  <text x="66" y="358" font-size="12.5">SARIMA (automatic order selection); state-space local level</text>
  <text x="60" y="386" font-size="13" font-weight="bold">With covariates (1 to 12 months)</text>
  <text x="66" y="404" font-size="12.5">The main models plus lagged temperature and salinity</text>
  <text x="60" y="432" font-size="13" font-weight="bold">Trend versions</text>
  <text x="66" y="450" font-size="12.5">SARIMA without and with a linear trend; damped trend;</text>
  <text x="66" y="467" font-size="12.5">state-space local linear trend</text>
  <text x="60" y="497" font-size="12" fill="#444">Each covariate and trend version is compared with its partner</text>
  <text x="60" y="513" font-size="12" fill="#444">main model. SARIMA (automatic) is the base model for the</text>
  <text x="60" y="529" font-size="12" fill="#444">results by group.</text>

  <!-- Step 2b references -->
  <rect x="435" y="270" width="310" height="280" rx="6" fill="#fbefe3" stroke="#a5621b"/>
  <text x="590" y="293" text-anchor="middle" font-size="14" font-weight="bold">2b. Simple reference forecasts</text>
  <text x="590" y="311" text-anchor="middle" font-size="12">Forecasts a manager could make at that date</text>
  <text x="450" y="345" font-size="13">Last month's value</text>
  <text x="450" y="372" font-size="13">Past average: all data up to the</text>
  <text x="450" y="390" font-size="13">forecast date (yardstick for skill)</text>
  <text x="450" y="417" font-size="13">Average of the last 12 months</text>
  <text x="450" y="435" font-size="13">(follows slow change in level)</text>
  <text x="450" y="475" font-size="12" fill="#444">The past average assumes no slow change;</text>
  <text x="450" y="492" font-size="12" fill="#444">the 12-month average follows it. Comparing</text>
  <text x="450" y="509" font-size="12" fill="#444">forecasts with both separates short-term</text>
  <text x="450" y="526" font-size="12" fill="#444">skill from skill owed to slow change.</text>

  <line x1="235" y1="550" x2="235" y2="603" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="590" y1="550" x2="590" y2="603" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Step 3 evaluation -->
  <rect x="25" y="605" width="750" height="355" rx="8" fill="#eef6ee" stroke="#3b7a3b"/>
  <text x="400" y="628" text-anchor="middle" font-size="14" font-weight="bold">3. Out-of-sample evaluation against what was observed later</text>
  <text x="400" y="646" text-anchor="middle" font-size="12" fill="#444">April and May 2020 (no sampling) never used as targets</text>

  <!-- row 1 -->
  <rect x="40" y="658" width="235" height="140" rx="5" fill="#ffffff" stroke="#3b7a3b"/>
  <text x="157" y="678" text-anchor="middle" font-size="13" font-weight="bold">3a. Absolute accuracy</text>
  <text x="52" y="699" font-size="12">RMSE of prediction errors (proportion</text>
  <text x="52" y="716" font-size="12">of series mean; log units)</text>
  <text x="52" y="735" font-size="12">Size of the monthly misses and</text>
  <text x="52" y="751" font-size="12">percentage within tolerance</text>
  <text x="52" y="770" font-size="12">Prediction interval coverage</text>
  <text x="52" y="789" font-size="12">Accuracy horizon (tolerance)</text>

  <rect x="283" y="658" width="235" height="140" rx="5" fill="#ffffff" stroke="#3b7a3b"/>
  <text x="400" y="678" text-anchor="middle" font-size="13" font-weight="bold">3b. Relative skill</text>
  <text x="295" y="699" font-size="12">Against the past average and</text>
  <text x="295" y="716" font-size="12">against the 12-month average</text>
  <text x="295" y="735" font-size="12">Skill horizons: months until</text>
  <text x="295" y="751" font-size="12">skill is lost</text>
  <text x="295" y="775" font-size="12">By period of the target month:</text>
  <text x="295" y="792" font-size="12">1992-2007, 2008-2019, 2020-2024</text>

  <rect x="526" y="658" width="235" height="140" rx="5" fill="#ffffff" stroke="#3b7a3b"/>
  <text x="643" y="678" text-anchor="middle" font-size="13" font-weight="bold">3c. Where variation comes from</text>
  <text x="538" y="699" font-size="12">Seasonal cycle; slow change</text>
  <text x="538" y="716" font-size="12">(skill at long leads); short-lived</text>
  <text x="538" y="733" font-size="12">carry-over (skill at 1 month);</text>
  <text x="538" y="750" font-size="12">unpredictable</text>

  <!-- row 2 -->
  <rect x="40" y="808" width="235" height="140" rx="5" fill="#ffffff" stroke="#3b7a3b"/>
  <text x="157" y="828" text-anchor="middle" font-size="13" font-weight="bold">3d. Shared large misses</text>
  <text x="52" y="849" font-size="12">Months in which many estuaries</text>
  <text x="52" y="866" font-size="12">miss by more than twice their</text>
  <text x="52" y="883" font-size="12">usual miss, with temperature</text>
  <text x="52" y="900" font-size="12">and salinity departures</text>

  <rect x="283" y="808" width="235" height="140" rx="5" fill="#ffffff" stroke="#3b7a3b"/>
  <text x="400" y="828" text-anchor="middle" font-size="13" font-weight="bold">3e. Management situations</text>
  <text x="295" y="849" font-size="12">Accuracy against skill, 1 and</text>
  <text x="295" y="866" font-size="12">12 months ahead: forecast-led,</text>
  <text x="295" y="883" font-size="12">mean-led, forecast with buffer,</text>
  <text x="295" y="900" font-size="12">precaution</text>

  <rect x="526" y="808" width="235" height="140" rx="5" fill="#ffffff" stroke="#3b7a3b"/>
  <text x="643" y="828" text-anchor="middle" font-size="13" font-weight="bold">3f. Do covariates or trends help?</text>
  <text x="538" y="849" font-size="12">Each covariate and trend version</text>
  <text x="538" y="866" font-size="12">against its partner main model:</text>
  <text x="538" y="883" font-size="12">series clearly better or clearly</text>
  <text x="538" y="900" font-size="12">worse (bootstrap range)</text>

  <!-- Side: descriptive -->
  <rect x="795" y="162" width="190" height="388" rx="6" fill="#f3eef8" stroke="#6a4a8c"/>
  <text x="890" y="185" text-anchor="middle" font-size="14" font-weight="bold">Data diagnostics</text>
  <text x="890" y="203" text-anchor="middle" font-size="12">Per series, whole record,</text>
  <text x="890" y="219" text-anchor="middle" font-size="12">no forecasts</text>
  <text x="807" y="248" font-size="12">Steady trend (Mann-Kendall,</text>
  <text x="817" y="264" font-size="12">Sen slope, yearly means)</text>
  <text x="807" y="288" font-size="12">Slow variation vs. noise</text>
  <text x="807" y="312" font-size="12">Steps (breakpoints);</text>
  <text x="817" y="328" font-size="12">2020 to 2024 step</text>
  <text x="807" y="352" font-size="12">Seasonal change between</text>
  <text x="817" y="368" font-size="12">halves of the record</text>
  <text x="807" y="392" font-size="12">Correlation by lag</text>
  <text x="807" y="416" font-size="12">Permutation entropy</text>
  <text x="817" y="432" font-size="12">(1- and 12-month steps)</text>
  <text x="807" y="470" font-size="12" fill="#444">Used to explain why</text>
  <text x="807" y="486" font-size="12" fill="#444">series differ in the</text>
  <text x="807" y="502" font-size="12" fill="#444">evaluation (3a to 3f)</text>

  <path d="M660,55 L890,55 L890,158" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
  <path d="M890,550 L890,780 L765,780" fill="none" stroke="#6a4a8c" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah)"/>
  <text x="898" y="680" font-size="12" fill="#6a4a8c">explains</text>
</svg>
